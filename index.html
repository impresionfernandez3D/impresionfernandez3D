<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impresiones 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1b21;
    --bg-elevated:#232430;
    --bg-card:#1f2028;
    --line:#34353f;
    --line-soft:#2a2b34;
    --text:#eeece6;
    --text-mute:#9c9ca6;
    --text-faint:#6b6b76;
    --accent:#ff7a29;
    --accent-ink:#3a1c04;
    --accent-2:#2fbf9f;
    --accent-soft:rgba(255,122,41,.14);
    --accent2-soft:rgba(47,191,159,.14);
    --radius-s:4px;
    --radius-m:10px;
    --maxw:1120px;
    --font-head:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important; scroll-behavior:auto !important;}
  }
  img{max-width:100%; display:block;}
  a{color:inherit;}
  button{font-family:inherit;}

  .layer-lines{
    background-image:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 7px
    );
  }

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:0; z-index:40;
    background:rgba(26,27,33,.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-soft);
  }
  header.site .bar{
    display:flex; align-items:center; justify-content:space-between;
    height:64px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-head); font-weight:700; font-size:1.15rem;
    text-decoration:none; letter-spacing:.2px;
  }
  .brand .mark{
    width:26px; height:26px; border-radius:3px;
    background:linear-gradient(160deg, var(--accent), #ffb173);
    position:relative; flex:none;
  }
  .brand .mark::before{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 1px, transparent 1px, transparent 4px);
    border-radius:3px;
  }
  header.site nav a{
    font-size:.92rem; color:var(--text-mute); text-decoration:none;
    padding:8px 4px; border-bottom:2px solid transparent;
  }
  header.site nav a:hover{color:var(--text);}

  /* ---------- Hero ---------- */
  .hero{
    padding:64px 0 48px;
    border-bottom:1px solid var(--line-soft);
  }
  .hero .kicker{
    color:var(--accent-2); font-weight:600; font-size:.85rem; margin:0 0 10px;
  }
  .hero h1{
    font-family:var(--font-head); font-weight:700;
    font-size:clamp(2rem, 4.2vw, 3.1rem);
    line-height:1.08; margin:0 0 16px; max-width:14ch;
  }
  .hero p{
    color:var(--text-mute); max-width:52ch; font-size:1.02rem; margin:0;
  }

  /* ---------- Popular strip ---------- */
  section.popular{padding:44px 0 8px;}
  section.popular .head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;
  }
  section.popular h2{
    font-family:var(--font-head); font-size:1.4rem; margin:0;
  }
  section.popular .head span{color:var(--text-faint); font-size:.88rem;}
  .popular-row{
    display:flex; gap:16px; overflow-x:auto; padding:4px 0 20px;
    scroll-snap-type:x proximity;
  }
  .popular-row::-webkit-scrollbar{height:6px;}
  .popular-row::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .p-card{
    flex:0 0 auto; width:220px; scroll-snap-align:start;
    background:var(--bg-card); border:1px solid var(--line-soft);
    border-radius:var(--radius-m); overflow:hidden; cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .p-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .p-card .thumb{
    height:170px; background:var(--bg-elevated); position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .p-card .thumb img{width:100%; height:100%; object-fit:cover;}
  .p-card .badge{
    position:absolute; top:8px; left:8px;
    background:var(--accent); color:var(--accent-ink);
    font-size:.68rem; font-weight:600; padding:3px 7px; border-radius:3px;
  }
  .p-card .info{padding:12px 13px 14px;}
  .p-card .info .name{font-weight:600; font-size:.94rem; margin:0 0 3px;}
  .p-card .info .price{color:var(--accent); font-weight:600; font-size:.92rem;}
  .no-img{color:var(--text-faint); font-size:.78rem;}

  /* ---------- Catalog index ---------- */
  section.catalogs{padding:40px 0 80px;}
  section.catalogs h2{font-family:var(--font-head); font-size:1.4rem; margin:0 0 18px;}
  .catalog-list{display:flex; flex-direction:column; border-top:1px solid var(--line-soft);}
  .catalog-row{
    display:flex; align-items:center; gap:18px;
    padding:20px 4px; border-bottom:1px solid var(--line-soft);
    text-decoration:none; color:inherit; cursor:pointer;
    position:relative;
  }
  .catalog-row::before{
    content:""; width:4px; align-self:stretch; border-radius:2px; flex:none;
    background:var(--bar-color, var(--accent));
  }
  .catalog-row .body{flex:1; min-width:0;}
  .catalog-row .name{font-family:var(--font-head); font-weight:600; font-size:1.08rem; margin:0 0 4px;}
  .catalog-row .desc{color:var(--text-mute); font-size:.88rem; margin:0;}
  .catalog-row .meta{color:var(--text-faint); font-size:.82rem; white-space:nowrap;}
  .catalog-row .chev{color:var(--text-faint); font-size:1.3rem; flex:none;}
  .catalog-row:hover .name{color:var(--accent);}

  .empty{
    color:var(--text-faint); font-size:.92rem; padding:28px 4px; border-top:1px solid var(--line-soft);
  }

  /* ---------- Catalog detail ---------- */
  .crumbs{padding:28px 0 4px; font-size:.86rem; color:var(--text-faint);}
  .crumbs a{color:var(--text-mute); text-decoration:none;}
  .crumbs a:hover{color:var(--accent);}
  .cat-head{padding:8px 0 26px; border-bottom:1px solid var(--line-soft); margin-bottom:30px;}
  .cat-head h1{font-family:var(--font-head); font-size:clamp(1.6rem,3vw,2.2rem); margin:0 0 8px;}
  .cat-head p{color:var(--text-mute); margin:0; max-width:60ch;}

  .product-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:18px; padding-bottom:80px;
  }
  .product-grid .p-card{width:auto;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,10,13,.72);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100; padding:0;
  }
  @media(min-width:720px){
    .overlay{align-items:center; padding:24px;}
  }
  .modal{
    background:var(--bg-card); width:100%; max-width:640px;
    border-radius:14px 14px 0 0; border:1px solid var(--line-soft); border-bottom:none;
    max-height:92vh; overflow-y:auto;
  }
  @media(min-width:720px){
    .modal{border-radius:var(--radius-m); border-bottom:1px solid var(--line-soft); display:flex;}
  }
  .modal .m-img{background:var(--bg-elevated); height:260px;}
  @media(min-width:720px){ .modal .m-img{width:46%; height:auto; flex:none;} }
  .modal .m-img img{width:100%; height:100%; object-fit:cover;}
  .modal .m-body{padding:26px 24px 28px; flex:1; min-width:0;}
  .modal .m-close{
    float:right; background:none; border:none; color:var(--text-faint);
    font-size:1.4rem; cursor:pointer; line-height:1; padding:4px;
  }
  .modal .m-close:hover{color:var(--text);}
  .modal h3{font-family:var(--font-head); font-size:1.35rem; margin:2px 0 10px; clear:both;}
  .modal .m-price{color:var(--accent); font-weight:600; font-size:1.15rem; margin-bottom:14px;}
  .modal .m-desc{color:var(--text-mute); font-size:.94rem; margin-bottom:24px; white-space:pre-wrap;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    padding:12px 20px; border-radius:8px; border:none; cursor:pointer;
    font-weight:600; font-size:.94rem; text-decoration:none;
    transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn-buy{background:#25D366; color:#06210f; width:100%;}
  .btn-ghost{background:var(--bg-elevated); color:var(--text); border:1px solid var(--line);}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-danger{background:transparent; color:#ff6f6f; border:1px solid rgba(255,111,111,.4);}
  .btn-sm{padding:8px 14px; font-size:.85rem;}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--line-soft); padding:26px 0; color:var(--text-faint); font-size:.82rem;}
  footer .wrap{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  footer a{color:var(--text-faint); text-decoration:none;}
  footer a:hover{color:var(--accent);}

  /* ---------- Admin ---------- */
  .admin-shell{padding:36px 0 100px;}
  .admin-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:12px;}
  .admin-top h1{font-family:var(--font-head); font-size:1.6rem; margin:0;}
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line-soft); margin-bottom:28px;}
  .tab{
    background:none; border:none; color:var(--text-mute); padding:10px 4px; margin-right:22px;
    font-size:.95rem; cursor:pointer; border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--text); border-color:var(--accent);}

  .gate{max-width:340px; margin:80px auto; text-align:center;}
  .gate h2{font-family:var(--font-head); margin-bottom:6px;}
  .gate p{color:var(--text-mute); font-size:.9rem; margin-bottom:20px;}
  .gate input{width:100%; margin-bottom:14px;}
  .gate .err{color:#ff6f6f; font-size:.85rem; margin-top:-6px; margin-bottom:14px; min-height:1em;}

  .panel{background:var(--bg-card); border:1px solid var(--line-soft); border-radius:var(--radius-m); padding:22px;}
  .panel + .panel{margin-top:18px;}
  .panel h3{font-family:var(--font-head); font-size:1.05rem; margin:0 0 16px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:.82rem; color:var(--text-mute); margin-bottom:6px;}
  input[type=text], input[type=number], input[type=password], textarea, select{
    width:100%; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); border-radius:6px; padding:10px 12px; font-size:.92rem; font-family:inherit;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible, a:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  textarea{resize:vertical; min-height:72px;}
  .checkline{display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--text-mute);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:520px){.row2{grid-template-columns:1fr;}}

  .img-pick{
    display:flex; align-items:center; gap:14px; margin-bottom:16px;
  }
  .img-pick .preview{
    width:76px; height:76px; border-radius:6px; background:var(--bg-elevated);
    border:1px solid var(--line); overflow:hidden; flex:none;
    display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:.7rem;
  }
  .img-pick .preview img{width:100%; height:100%; object-fit:cover;}

  .admin-list{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .admin-item{
    display:flex; align-items:center; gap:12px; padding:10px; border:1px solid var(--line-soft);
    border-radius:8px; background:var(--bg-elevated);
  }
  .admin-item .thumb{width:44px; height:44px; border-radius:5px; background:var(--bg-card); flex:none; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:.6rem;}
  .admin-item .thumb img{width:100%; height:100%; object-fit:cover;}
  .admin-item .meta{flex:1; min-width:0;}
  .admin-item .meta .t{font-weight:600; font-size:.9rem; margin:0;}
  .admin-item .meta .s{color:var(--text-faint); font-size:.78rem; margin:2px 0 0;}
  .admin-item .actions{display:flex; gap:8px; flex:none;}
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--text-mute);
    border-radius:6px; width:32px; height:32px; cursor:pointer; font-size:.85rem;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--text-mute);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--bg-elevated); border:1px solid var(--line); color:var(--text);
    padding:11px 18px; border-radius:8px; font-size:.88rem; z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .hint{color:var(--text-faint); font-size:.78rem; margin-top:-10px; margin-bottom:16px;}
  .loading{padding:80px 0; text-align:center; color:var(--text-faint);}
</style>
</head>
<body>

<header class="site">
  <div class="wrap bar">
    <a href="#/" class="brand"><span class="mark"></span>Impresiones 3D</a>
    <nav>
      <a href="#/admin">Panel</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>Impresiones 3D — piezas hechas a pedido.</span>
    <a href="#/admin">Administrar catálogo</a>
  </div>
</footer>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================
   CONFIGURACIÓN — lo único que normalmente tocarías a mano
   ========================================================= */
const WHATSAPP_NUMBER = "1150501093"; // 11 5050-1093 en formato internacional
const ADMIN_PASSWORD = "Laacade123455"; // Cambiá esta clave antes de publicar el panel

/* =========================================================
   Utilidades de almacenamiento (persisten entre sesiones)
   ========================================================= */
async function listAll(prefix, shared){
  try{
    const res = await window.storage.list(prefix, shared);
    return res ? res.keys : [];
  }catch(e){ return []; }
}
async function getItem(key, shared){
  try{
    const res = await window.storage.get(key, shared);
    return res ? JSON.parse(res.value) : null;
  }catch(e){ return null; }
}
async function setItem(key, value, shared){
  return window.storage.set(key, JSON.stringify(value), shared);
}
async function deleteItem(key, shared){
  try{ await window.storage.delete(key, shared); }catch(e){}
}

async function getCatalogs(){
  const keys = await listAll('catalog:', true);
  const items = await Promise.all(keys.map(k => getItem(k, true)));
  return items.filter(Boolean).sort((a,b)=> (a.order||0) - (b.order||0));
}
async function getProducts(){
  const keys = await listAll('product:', true);
  const items = await Promise.all(keys.map(k => getItem(k, true)));
  return items.filter(Boolean).sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* =========================================================
   Helpers varios
   ========================================================= */
function money(v){
  const n = Number(v);
  if(isNaN(n)) return v || '';
  return '$' + n.toLocaleString('es-AR');
}
function waLink(product){
  const msg = `Hola! Me interesa este producto: ${product.name}. ¿Me pasás más info?`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function compressImage(file, maxW=900, quality=0.78){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function productCardHtml(p){
  const img = p.image
    ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">`
    : `<span class="no-img">Sin foto</span>`;
  return `
    <div class="p-card" data-open-product="${p.id}">
      <div class="thumb">
        ${p.popular ? '<span class="badge">Popular</span>' : ''}
        ${img}
      </div>
      <div class="info">
        <p class="name">${escapeHtml(p.name)}</p>
        <p class="price">${money(p.price)}</p>
      </div>
    </div>`;
}

let CATALOGS = [];
let PRODUCTS = [];
const BAR_COLORS = ['var(--accent)','var(--accent-2)'];

/* =========================================================
   Router
   ========================================================= */
const app = document.getElementById('app');

async function loadData(){
  const [c, p] = await Promise.all([getCatalogs(), getProducts()]);
  CATALOGS = c; PRODUCTS = p;
}

async function render(){
  const hash = location.hash || '#/';
  app.innerHTML = `<div class="loading">Cargando catálogo…</div>`;
  await loadData();

  if(hash.startsWith('#/admin')){
    renderAdmin();
    return;
  }
  const catMatch = hash.match(/^#\/catalog\/(.+)$/);
  if(catMatch){
    renderCatalog(decodeURIComponent(catMatch[1]));
    return;
  }
  renderHome();
  closeModal();
}

function renderHome(){
  const popular = PRODUCTS.filter(p => p.popular);
  const popularHtml = popular.length ? `
    <section class="popular">
      <div class="wrap">
        <div class="head">
          <h2>Los más pedidos</h2>
          <span>${popular.length} pieza${popular.length===1?'':'s'}</span>
        </div>
        <div class="popular-row">
          ${popular.map(productCardHtml).join('')}
        </div>
      </div>
    </section>` : '';

  const catalogRows = CATALOGS.map((c, i) => {
    const count = PRODUCTS.filter(p => p.catalogId === c.id).length;
    return `
      <a class="catalog-row" href="#/catalog/${encodeURIComponent(c.id)}" style="--bar-color:${BAR_COLORS[i % BAR_COLORS.length]}">
        <div class="body">
          <p class="name">${escapeHtml(c.name)}</p>
          <p class="desc">${escapeHtml(c.description || '')}</p>
        </div>
        <span class="meta">${count} producto${count===1?'':'s'}</span>
        <span class="chev">›</span>
      </a>`;
  }).join('');

  app.innerHTML = `
    <section class="hero">
      <div class="wrap">
        <p class="kicker">Piezas impresas a pedido</p>
        <h1>Diseños en 3D, listos para imprimir y enviar</h1>
        <p>Elegí una pieza de los más pedidos o recorré los catálogos para ver todo lo disponible. Al comprar, te llevamos directo a WhatsApp con el producto ya seleccionado.</p>
      </div>
    </section>
    ${popularHtml}
    <section class="catalogs">
      <div class="wrap">
        <h2>Catálogos</h2>
        <div class="catalog-list">
          ${catalogRows || '<div class="empty">Todavía no hay catálogos cargados.</div>'}
        </div>
      </div>
    </section>
  `;
  bindProductOpens();
}

function renderCatalog(id){
  const cat = CATALOGS.find(c => c.id === id);
  if(!cat){
    app.innerHTML = `<div class="wrap"><p class="empty">No encontramos ese catálogo. <a href="#/">Volver</a></p></div>`;
    return;
  }
  const products = PRODUCTS.filter(p => p.catalogId === id);
  app.innerHTML = `
    <div class="wrap">
      <p class="crumbs"><a href="#/">Inicio</a> &nbsp;/&nbsp; ${escapeHtml(cat.name)}</p>
      <div class="cat-head">
        <h1>${escapeHtml(cat.name)}</h1>
        ${cat.description ? `<p>${escapeHtml(cat.description)}</p>` : ''}
      </div>
      <div class="product-grid">
        ${products.map(productCardHtml).join('') || '<p class="empty">Este catálogo todavía no tiene productos.</p>'}
      </div>
    </div>
  `;
  bindProductOpens();
}

function bindProductOpens(){
  app.querySelectorAll('[data-open-product]').forEach(el => {
    el.addEventListener('click', () => openModal(el.getAttribute('data-open-product')));
  });
}

/* ---------- Modal de producto ---------- */
function openModal(id){
  const p = PRODUCTS.find(x => x.id === id);
  if(!p) return;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="m-img">
          ${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : ''}
        </div>
        <div class="m-body">
          <button class="m-close" aria-label="Cerrar">×</button>
          <h3>${escapeHtml(p.name)}</h3>
          <p class="m-price">${money(p.price)}</p>
          <p class="m-desc">${escapeHtml(p.description || '')}</p>
          <a class="btn btn-buy" href="${waLink(p)}" target="_blank" rel="noopener">Comprar por WhatsApp</a>
        </div>
      </div>
    </div>`;
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  root.querySelector('.m-close').addEventListener('click', closeModal);
}
function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
}

/* =========================================================
   Panel de administración
   ========================================================= */
let isAdmin = false;
let adminTab = 'catalogos';
let editingCatalog = null; // objeto en edición o null
let editingProduct = null;
let pickedImageData = null; // para el form de producto

function renderAdmin(){
  if(!isAdmin){
    app.innerHTML = `
      <div class="wrap">
        <div class="gate">
          <h2>Panel de administración</h2>
          <p>Ingresá la clave para editar catálogos y productos.</p>
          <input type="password" id="admin-pass" placeholder="Clave">
          <p class="err" id="admin-err"></p>
          <button class="btn btn-accent" id="admin-enter" style="width:100%">Entrar</button>
        </div>
      </div>`;
    document.getElementById('admin-enter').addEventListener('click', tryLogin);
    document.getElementById('admin-pass').addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });
    return;
  }
  app.innerHTML = `
    <div class="wrap admin-shell">
      <div class="admin-top">
        <h1>Administrar</h1>
        <a class="btn btn-ghost btn-sm" href="#/">Ver la tienda</a>
      </div>
      <div class="tabs">
        <button class="tab ${adminTab==='catalogos'?'active':''}" data-tab="catalogos">Catálogos</button>
        <button class="tab ${adminTab==='productos'?'active':''}" data-tab="productos">Productos</button>
      </div>
      <div id="admin-body"></div>
    </div>`;

  app.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { adminTab = t.getAttribute('data-tab'); renderAdmin(); });
  });

  if(adminTab === 'catalogos') renderCatalogAdmin();
  else renderProductAdmin();
}

function tryLogin(){
  const val = document.getElementById('admin-pass').value;
  if(val === ADMIN_PASSWORD){
    isAdmin = true;
    renderAdmin();
  }else{
    document.getElementById('admin-err').textContent = 'Clave incorrecta.';
  }
}

/* ---------- Admin: catálogos ---------- */
function renderCatalogAdmin(){
  const body = document.getElementById('admin-body');
  const c = editingCatalog || {name:'', description:''};
  body.innerHTML = `
    <div class="panel">
      <h3>${editingCatalog && editingCatalog.id ? 'Editar catálogo' : 'Nuevo catálogo'}</h3>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="cat-name" value="${escapeHtml(c.name)}" placeholder="Ej: Llaveros">
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="cat-desc" placeholder="Una línea contando qué incluye este catálogo">${escapeHtml(c.description)}</textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-accent" id="cat-save">${editingCatalog && editingCatalog.id ? 'Guardar cambios' : 'Crear catálogo'}</button>
        ${editingCatalog ? '<button class="btn btn-ghost" id="cat-cancel">Cancelar</button>' : ''}
      </div>
    </div>
    <div class="panel">
      <h3>Catálogos existentes</h3>
      <div class="admin-list" id="cat-list">
        ${CATALOGS.map(cat => {
          const count = PRODUCTS.filter(p=>p.catalogId===cat.id).length;
          return `
          <div class="admin-item">
            <div class="meta">
              <p class="t">${escapeHtml(cat.name)}</p>
              <p class="s">${count} producto${count===1?'':'s'}</p>
            </div>
            <div class="actions">
              <button class="icon-btn" data-edit-cat="${cat.id}" title="Editar">✎</button>
              <button class="icon-btn" data-del-cat="${cat.id}" title="Eliminar">✕</button>
            </div>
          </div>`;
        }).join('') || '<p class="hint" style="margin:0;">Todavía no cargaste catálogos.</p>'}
      </div>
    </div>
  `;

  document.getElementById('cat-save').addEventListener('click', saveCatalogFromForm);
  const cancelBtn = document.getElementById('cat-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', () => { editingCatalog = null; renderCatalogAdmin(); });

  body.querySelectorAll('[data-edit-cat]').forEach(b => {
    b.addEventListener('click', () => {
      editingCatalog = CATALOGS.find(c => c.id === b.getAttribute('data-edit-cat'));
      renderCatalogAdmin();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
  body.querySelectorAll('[data-del-cat]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.getAttribute('data-del-cat');
      const count = PRODUCTS.filter(p=>p.catalogId===id).length;
      if(count > 0){
        alert('Este catálogo tiene productos asociados. Movelos o eliminalos primero.');
        return;
      }
      if(!confirm('¿Eliminar este catálogo?')) return;
      await deleteItem('catalog:' + id, true);
      await loadData();
      renderCatalogAdmin();
      toast('Catálogo eliminado');
    });
  });
}

async function saveCatalogFromForm(){
  const name = document.getElementById('cat-name').value.trim();
  const description = document.getElementById('cat-desc').value.trim();
  if(!name){ toast('Poné un nombre para el catálogo'); return; }
  const base = editingCatalog || {};
  const item = {
    id: base.id || uid(),
    name, description,
    order: base.order ?? CATALOGS.length,
  };
  await setItem('catalog:' + item.id, item, true);
  editingCatalog = null;
  await loadData();
  renderCatalogAdmin();
  toast('Catálogo guardado');
}

/* ---------- Admin: productos ---------- */
function renderProductAdmin(){
  const body = document.getElementById('admin-body');
  const p = editingProduct || {name:'', price:'', description:'', catalogId:'', popular:false, image:null};
  pickedImageData = p.image || null;

  if(CATALOGS.length === 0){
    body.innerHTML = `<div class="panel"><p class="hint" style="margin:0;">Primero creá al menos un catálogo en la pestaña "Catálogos".</p></div>`;
    return;
  }

  body.innerHTML = `
    <div class="panel">
      <h3>${editingProduct && editingProduct.id ? 'Editar producto' : 'Nuevo producto'}</h3>
      <div class="img-pick">
        <div class="preview" id="img-preview">${p.image ? `<img src="${p.image}">` : 'Sin foto'}</div>
        <div>
          <input type="file" id="prod-img" accept="image/*">
          <p class="hint" style="margin:6px 0 0;">La foto se comprime automáticamente.</p>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="prod-name" value="${escapeHtml(p.name)}" placeholder="Ej: Llavero gato">
        </div>
        <div class="field">
          <label>Precio</label>
          <input type="number" id="prod-price" value="${p.price}" placeholder="0">
        </div>
      </div>
      <div class="field">
        <label>Catálogo</label>
        <select id="prod-cat">
          ${CATALOGS.map(c => `<option value="${c.id}" ${c.id===p.catalogId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="prod-desc" placeholder="Material, tamaño, colores disponibles, tiempo de entrega...">${escapeHtml(p.description)}</textarea>
      </div>
      <div class="field checkline">
        <input type="checkbox" id="prod-popular" ${p.popular?'checked':''}>
        <label for="prod-popular" style="margin:0;">Mostrar en "Los más pedidos"</label>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-accent" id="prod-save">${editingProduct && editingProduct.id ? 'Guardar cambios' : 'Crear producto'}</button>
        ${editingProduct ? '<button class="btn btn-ghost" id="prod-cancel">Cancelar</button>' : ''}
      </div>
    </div>
    <div class="panel">
      <h3>Productos cargados</h3>
      <div class="admin-list">
        ${PRODUCTS.map(prod => {
          const cat = CATALOGS.find(c=>c.id===prod.catalogId);
          return `
          <div class="admin-item">
            <div class="thumb">${prod.image ? `<img src="${prod.image}">` : 'Sin foto'}</div>
            <div class="meta">
              <p class="t">${escapeHtml(prod.name)} ${prod.popular ? '★' : ''}</p>
              <p class="s">${cat ? escapeHtml(cat.name) : 'Sin catálogo'} · ${money(prod.price)}</p>
            </div>
            <div class="actions">
              <button class="icon-btn" data-edit-prod="${prod.id}" title="Editar">✎</button>
              <button class="icon-btn" data-del-prod="${prod.id}" title="Eliminar">✕</button>
            </div>
          </div>`;
        }).join('') || '<p class="hint" style="margin:0;">Todavía no cargaste productos.</p>'}
      </div>
    </div>
  `;

  document.getElementById('prod-img').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await compressImage(file);
    pickedImageData = dataUrl;
    document.getElementById('img-preview').innerHTML = `<img src="${dataUrl}">`;
  });

  document.getElementById('prod-save').addEventListener('click', saveProductFromForm);
  const cancelBtn = document.getElementById('prod-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', () => { editingProduct = null; renderProductAdmin(); });

  body.querySelectorAll('[data-edit-prod]').forEach(b => {
    b.addEventListener('click', () => {
      editingProduct = PRODUCTS.find(x => x.id === b.getAttribute('data-edit-prod'));
      renderProductAdmin();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
  body.querySelectorAll('[data-del-prod]').forEach(b => {
    b.addEventListener('click', async () => {
      if(!confirm('¿Eliminar este producto?')) return;
      await deleteItem('product:' + b.getAttribute('data-del-prod'), true);
      await loadData();
      renderProductAdmin();
      toast('Producto eliminado');
    });
  });
}

async function saveProductFromForm(){
  const name = document.getElementById('prod-name').value.trim();
  const price = document.getElementById('prod-price').value;
  const catalogId = document.getElementById('prod-cat').value;
  const description = document.getElementById('prod-desc').value.trim();
  const popular = document.getElementById('prod-popular').checked;
  if(!name){ toast('Poné un nombre para el producto'); return; }
  const base = editingProduct || {};
  const item = {
    id: base.id || uid(),
    name, price, catalogId, description, popular,
    image: pickedImageData || null,
    createdAt: base.createdAt || Date.now(),
  };
  await setItem('product:' + item.id, item, true);
  editingProduct = null;
  await loadData();
  renderProductAdmin();
  toast('Producto guardado');
}

/* =========================================================
   Init
   ========================================================= */
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
